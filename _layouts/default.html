<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/pixfinder-main-small.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ '/assets/pixfinder-main-small.jpg' | absolute_url }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon-180.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif; color: #0F1115; background: #FBFBFD; -webkit-font-smoothing: antialiased; }
  ::selection { background: #FFD3C2; color: #0F1115; }
  .pf-nav-link { color: #5A6472; text-decoration: none; font-size: 15px; transition: color .15s; }
  .pf-nav-link:hover { color: #0F1115; }
  .pf-hero-download { flex-wrap: nowrap; }
  .pf-hero-download > a { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 15px 20px; border: 1px solid transparent; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
  .pf-hero-download svg { flex-shrink: 0; }
  .pf-download-store { background: #00A3FF; color: #fff; box-shadow: 0 8px 24px rgba(0,163,255,0.32); }
  .pf-download-store:hover { background: #008FE0; }
  .pf-hero-download > .pf-download-installer { background: #fff; color: #0F1115; border-color: #DCE1E8; }
  .pf-hero-download > .pf-download-installer:hover { background: #F0F8FF; border-color: #00A3FF; }
  .pf-hero-download > a:focus-visible { outline: 2px solid #00A3FF; outline-offset: 4px; }
  @media (min-width: 761px) and (max-width: 1000px) {
    .pf-hero-download { gap: 10px !important; }
    .pf-hero-download > a { padding-left: 12px; padding-right: 12px; font-size: 14px; }
  }
  @media (max-width: 760px) {
    .pf-hero-content { display: contents; }
    .pf-hero-copy { order: 0; }
    .pf-hero-copy > p { margin-bottom: 0 !important; }
    .pf-hero-visual { order: 1; }
    .pf-hero-download { order: 2; flex-direction: column; align-items: stretch !important; }
    .pf-hero-download > a { width: 100%; }
  }
  .pf-main-nav { display: flex; align-items: center; justify-content: space-between; flex: 1; gap: 24px; }
  .pf-nav-links { margin: 0 auto; }
  .pf-menu-toggle { display: none; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border: 1px solid #EAECF2; border-radius: 10px; background: #fff; color: #0F1115; font: inherit; cursor: pointer; }
  .pf-menu-toggle:focus-visible, .pf-main-nav a:focus-visible { outline: 2px solid #00A3FF; outline-offset: 4px; }
  @media (max-width: 760px) {
    header > .pf-container { flex-wrap: wrap; gap: 12px !important; }
    .pf-menu-toggle { display: inline-flex; }
    .pf-main-nav { display: none; flex: 0 0 100%; flex-direction: column; align-items: stretch; gap: 16px; padding-top: 12px; border-top: 1px solid #EAECF2; }
    .pf-menu-toggle[aria-expanded="true"] + .pf-main-nav { display: flex; }
    .pf-main-nav .pf-nav-links { display: flex !important; flex-direction: column; align-items: stretch !important; gap: 0 !important; margin: 0; }
    .pf-main-nav .pf-nav-link { display: block; padding: 12px 0; }
    .pf-main-nav > a { justify-content: center; min-height: 44px; }
  }
  @media (max-width: 760px) { .pf-container { padding-left: 20px !important; padding-right: 20px !important; } .pf-grid-2 { grid-template-columns: 1fr !important; gap: 32px !important; } .pf-grid-3 { grid-template-columns: 1fr !important; } .pf-hero { padding-top: 40px !important; padding-bottom: 32px !important; } .pf-hero-h1 { font-size: 36px !important; } .pf-h2 { font-size: 28px !important; } .pf-h2-lg { font-size: 30px !important; } .pf-hero-shot { transform: none !important; } .pf-swap-first { order: 2 !important; } .pf-privacy-card { padding: 32px 24px !important; } .pf-cta-card { padding: 40px 20px !important; } .pf-section { padding-top: 40px !important; padding-bottom: 40px !important; } .pf-footer-inner { flex-direction: column !important; align-items: flex-start !important; } }
</style>

</head>
<body>
<div style="min-height:100vh; overflow-x:clip;">
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
</div>
</body>
</html>
